
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadence</title>
    <link rel="manifest" href="./manifest.json" />
    <!-- Tailwind CSS is compiled at build time via PostCSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Minimal critical CSS to prevent FOUC; full design system lives in app/theme.css -->
    <style>
      html, body {
        background-color: #f7f6f4;
        font-family: 'Inter', sans-serif;
      }
    </style>
    <meta name="theme-color" content="#8A1538" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Cadence - Premium scheduling application for teams who value every moment. Experience the new standard in time management." />
</head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="./app/main.tsx"></script>
    <script>
      // Clean rebuild: proactively unregister any stale service worker from the
      // OLD app so it can't keep serving cached old assets. (No SW in the rebuild.)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister()));
      }
    </script>
  </body>
</html>
